<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Default Site</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#4C1D95">
  <link rel="stylesheet" type="text/css" href="/semantic.min.css">
  <link rel="stylesheet" type="text/css" href="/styles/screen.css">
  <script src="/scripts/jquery-3.4.1.js"></script>
  <script src="/semantic.min.js"></script>
</head>
<body>
  <div id="application-target"><fabric-application><fabric-grid><fabric-column><fabric-message-list>
            <div class="ui segment">
              <h2>History</h2>
              <ul></ul>
            </div>
          </fabric-message-list>
          <div data-slot="content" id="browser-content"></div><fabric-message-composer>
            <form class="ui form" method="POST" data-action="_submitPrompt">
              <div class="field">
                <p>How can we help?</p>
              </div>
              <div class="field">
                <label for="query">
                  <h3>Your question</h3>
                </label>
                <input type="text" name="query" placeholder="Search documents, users, or ideas" />
              </div>
              <div class="right floated field">
                <button type="submit" class="ui submit button" data-action="_submitPrompt">Create</button>
              </div>
            </form>
          </fabric-message-composer>
        </fabric-column><fabric-column><fabric-peer-list>
            <div class="ui segment">
              <h2>Peers</h2>
              <maki-grid-view>
                <maki-grid-row>
                  <maki-grid-column>
                    <fabric-peer-table></fabric-peer-table>
                  </maki-grid-column>
                </maki-grid-row>
              </maki-grid-view>
            </div>
          </fabric-peer-list><fabric-log-list>
            <div class="ui segment">
              <h2>Logs</h2>
              <ul></ul>
            </div>
          </fabric-log-list><fabric-menu>
            <div>fake menu</div>
          </fabric-menu><fabric-debug><fabric-grid-row class="ui inverted vertical footer segment">
              <div class="ui container">
                <h2>Debug Information</h2>
                <fabric-grid-row>
                  <fabric-channel></fabric-channel>
                  <nav data-bind="controls">
                    <button data-action="_generateIdentity" class="ui button">create new identity</button>
                    <button data-action="_toggleFullscreen" class="ui button">fullscreen</button>
                  </nav>
                  <div>
                    <p><code>Version:</code> <code>undefined</code></p>
                    <p><code>Clock:</code> <code data-bind="/clock">undefined</code></p>
                    <p><strong>Source:</strong> <a href="https://github.com/FabricLabs/web">fabric:github.com/FabricLabs/web</a>
                  </div>
                </fabric-grid-row>
              </div>
            </fabric-grid-row>
            <!-- [0]: README [dot] md -->
            <!--

    --></fabric-debug></fabric-column></fabric-grid></fabric-application></div>
  <script src="/bundles/browser.min.js" data-fullhash=""></script>
  <script type="text/javascript">
    if (customElements && !customElements.get('fabric-peer-list')) {
      customElements.define('fabric-peer-list', FabricPeerList);
    }
  </script>
</body>
</html>
